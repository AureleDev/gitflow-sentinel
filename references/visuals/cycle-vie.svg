<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cycle de vie d’un projet avec Gitflow Sentinel</title>
  <desc id="desc">Deux entrées, dossier vide ou dépôt existant, convergent vers l’inspection, le plan approuvé, l’application transactionnelle, la vérification puis la maintenance ou la restauration.</desc>
  <defs>
    <style>
      :root { color-scheme: light dark; }
      .bg { fill: #f7f9fc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .green { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
      .blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
      .amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; }
      .purple { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; }
      .rose { fill: #fff1f2; stroke: #f43f5e; stroke-width: 2; }
      .ink { fill: #172033; font-family: Inter, "Segoe UI", sans-serif; }
      .muted { fill: #5b6578; font-family: Inter, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 750; }
      .subtitle { font-size: 15px; }
      .h { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.4; marker-end: url(#arrow); }
      .soft-arrow { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-soft); }
      .badge { fill: #172033; }
      .badge-text { fill: #ffffff; font-family: Inter, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; }
      .pill { fill: #dbeafe; }
      .pill-rose { fill: #ffe4e6; }
      .pill-text { fill: #172033; font-family: Inter, "Segoe UI", sans-serif; font-size: 12px; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0b1020; }
        .panel { fill: #121a2b; stroke: #334155; }
        .green { fill: #0b2a22; stroke: #34d399; }
        .blue { fill: #10243f; stroke: #60a5fa; }
        .amber { fill: #2c210b; stroke: #fbbf24; }
        .purple { fill: #221a3b; stroke: #a78bfa; }
        .rose { fill: #32131c; stroke: #fb7185; }
        .ink { fill: #edf2f7; }
        .muted { fill: #aeb9ca; }
        .arrow { stroke: #94a3b8; }
        .soft-arrow { stroke: #64748b; }
        .badge { fill: #e2e8f0; }
        .badge-text { fill: #0f172a; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text class="ink title" x="54" y="58">Un même cycle, que le projet soit vide ou déjà vivant</text>
  <text class="muted subtitle" x="54" y="84">Sentinel part de l’état réel, propose un état désiré, puis ne modifie rien sans approbation explicite.</text>

  <rect class="green" x="54" y="122" rx="18" width="250" height="118"/>
  <rect class="badge" x="74" y="140" rx="12" width="90" height="25"/>
  <text class="badge-text" x="119" y="157" text-anchor="middle">GREENFIELD</text>
  <text class="ink h" x="74" y="193">Dossier vide</text>
  <text class="muted body" x="74" y="217">Initialiser Git et les fondations</text>

  <rect class="blue" x="54" y="274" rx="18" width="250" height="118"/>
  <rect class="badge" x="74" y="292" rx="12" width="100" height="25"/>
  <text class="badge-text" x="124" y="309" text-anchor="middle">BROWNFIELD</text>
  <text class="ink h" x="74" y="345">Dépôt existant</text>
  <text class="muted body" x="74" y="369">Préserver les choix déjà présents</text>

  <path class="arrow" d="M 304 181 C 350 181, 350 244, 399 244"/>
  <path class="arrow" d="M 304 333 C 350 333, 350 260, 399 260"/>

  <rect class="panel" x="399" y="174" rx="18" width="235" height="142"/>
  <circle cx="428" cy="203" r="15" fill="#3b82f6"/>
  <text x="428" y="208" text-anchor="middle" class="badge-text">1</text>
  <text class="ink h" x="454" y="209">Inspecter</text>
  <text class="muted body" x="422" y="241">Technologies, Git, CI, docs,</text>
  <text class="muted body" x="422" y="263">agents, sécurité et GitHub.</text>
  <text class="muted small" x="422" y="291">Sortie : ProjectSnapshot</text>

  <path class="arrow" d="M 634 245 L 688 245"/>

  <rect class="amber" x="688" y="174" rx="18" width="220" height="142"/>
  <circle cx="717" cy="203" r="15" fill="#f59e0b"/>
  <text x="717" y="208" text-anchor="middle" class="badge-text">2</text>
  <text class="ink h" x="743" y="209">Décider</text>
  <text class="muted body" x="711" y="241">Profil + choix non déductibles.</text>
  <text class="muted body" x="711" y="263">L’IA explique les compromis.</text>
  <text class="muted small" x="711" y="291">Sortie : DesiredState</text>

  <path class="arrow" d="M 908 245 L 962 245"/>

  <rect class="purple" x="962" y="174" rx="18" width="184" height="142"/>
  <circle cx="991" cy="203" r="15" fill="#8b5cf6"/>
  <text x="991" y="208" text-anchor="middle" class="badge-text">3</text>
  <text class="ink h" x="1017" y="209">Planifier</text>
  <text class="muted body" x="985" y="241">Diff, risques, aperçu,</text>
  <text class="muted body" x="985" y="263">préconditions, restauration.</text>
  <text class="muted small" x="985" y="291">Sortie : ChangePlan + hash</text>

  <path class="arrow" d="M 1054 316 L 1054 365"/>

  <rect class="amber" x="881" y="365" rx="18" width="265" height="118"/>
  <text class="ink h" x="906" y="399">Approbation humaine</text>
  <text class="muted body" x="906" y="426">Globale en R1, par groupe en R2,</text>
  <text class="muted body" x="906" y="449">dédiée pour chaque action R3.</text>

  <path class="arrow" d="M 881 424 L 824 424"/>

  <rect class="green" x="589" y="365" rx="18" width="235" height="118"/>
  <circle cx="618" cy="394" r="15" fill="#10b981"/>
  <text x="618" y="399" text-anchor="middle" class="badge-text">4</text>
  <text class="ink h" x="644" y="400">Appliquer</text>
  <text class="muted body" x="612" y="430">Écritures atomiques, sauvegardes</text>
  <text class="muted body" x="612" y="452">et journal de transaction local.</text>

  <path class="arrow" d="M 589 424 L 532 424"/>

  <rect class="blue" x="297" y="365" rx="18" width="235" height="118"/>
  <circle cx="326" cy="394" r="15" fill="#3b82f6"/>
  <text x="326" y="399" text-anchor="middle" class="badge-text">5</text>
  <text class="ink h" x="352" y="400">Vérifier</text>
  <text class="muted body" x="320" y="430">Fichiers, Git, CI et état distant</text>
  <text class="muted body" x="320" y="452">sont comparés à l’état désiré.</text>

  <path class="arrow" d="M 297 424 L 240 424"/>

  <rect class="panel" x="54" y="399" rx="18" width="186" height="84"/>
  <circle cx="83" cy="424" r="15" fill="#64748b"/>
  <text x="83" y="429" text-anchor="middle" class="badge-text">6</text>
  <text class="ink h" x="109" y="430">Maintenir</text>
  <text class="muted body" x="77" y="456">status · verify · update</text>
  <text class="muted small" x="77" y="475">migrations disponibles</text>

  <path class="soft-arrow" d="M 147 483 L 147 543"/>
  <path class="soft-arrow" d="M 707 483 L 707 543"/>

  <rect class="panel" x="54" y="543" rx="18" width="500" height="139"/>
  <text class="ink h" x="80" y="577">Évolution normale</text>
  <text class="muted body" x="80" y="608">Le projet change → Sentinel réinspecte → recalcule uniquement le diff.</text>
  <text class="muted body" x="80" y="633">Deux applications successives doivent être idempotentes : zéro changement.</text>
  <rect class="pill" x="80" y="650" rx="10" width="185" height="22"/>
  <text x="172" y="666" text-anchor="middle" class="pill-text">Local d’abord · GitHub facultatif</text>

  <rect class="rose" x="589" y="543" rx="18" width="557" height="139"/>
  <text class="ink h" x="615" y="577">Erreur, interruption ou retrait</text>
  <text class="muted body" x="615" y="608">resume reprend une transaction sûre · rollback restaure exactement l’avant.</text>
  <text class="muted body" x="615" y="633">uninstall retire seulement les éléments possédés par Sentinel.</text>
  <rect class="pill-rose" x="615" y="650" rx="10" width="240" height="22"/>
  <text x="735" y="666" text-anchor="middle" class="pill-text">Aucun commit, push ou publish automatique</text>

  <text class="muted small" x="54" y="726">Commandes clés : setup/init → inspect → plan → apply → verify → status/update → rollback/uninstall</text>
</svg>
