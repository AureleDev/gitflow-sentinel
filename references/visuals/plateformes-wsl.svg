<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Portabilité des agents et rôle de WSL</title>
  <desc id="desc">Codex, Claude Code et OpenCode utilisent le même skill et le même moteur. Windows natif est déjà validé. WSL est facultatif pour l’usage, mais utile pour valider Linux. macOS et GitHub distant restent à valider.</desc>
  <defs>
    <style>
      :root { color-scheme: light dark; }
      .bg { fill: #f7f9fc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .core { fill: #172033; stroke: #172033; stroke-width: 2; }
      .skill { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; }
      .ok { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
      .next { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; }
      .later { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .ink { fill: #172033; font-family: Inter, "Segoe UI", sans-serif; }
      .light { fill: #ffffff; font-family: Inter, "Segoe UI", sans-serif; }
      .muted { fill: #5b6578; font-family: Inter, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 750; }
      .subtitle { font-size: 15px; }
      .h { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.3; marker-end: url(#arrow); }
      .line { fill: none; stroke: #94a3b8; stroke-width: 2; }
      .status-ok { fill: #10b981; }
      .status-next { fill: #f59e0b; }
      .status-later { fill: #64748b; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0b1020; }
        .panel { fill: #121a2b; stroke: #334155; }
        .core { fill: #e2e8f0; stroke: #e2e8f0; }
        .skill { fill: #221a3b; stroke: #a78bfa; }
        .ok { fill: #0b2a22; stroke: #34d399; }
        .next { fill: #2c210b; stroke: #fbbf24; }
        .later { fill: #111827; stroke: #64748b; }
        .ink { fill: #edf2f7; }
        .light { fill: #0f172a; }
        .muted { fill: #aeb9ca; }
        .arrow { stroke: #94a3b8; }
        .line { stroke: #64748b; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="780"/>
  <text class="ink title" x="54" y="58">Une seule intelligence de projet, plusieurs agents et plateformes</text>
  <text class="muted subtitle" x="54" y="84">Le comportement vient du skill portable ; les opérations sensibles restent dans le même moteur déterministe.</text>

  <rect class="panel" x="54" y="120" rx="18" width="250" height="115"/>
  <circle cx="91" cy="157" r="20" fill="#3b82f6"/>
  <text class="light h" x="91" y="163" text-anchor="middle">C</text>
  <text class="ink h" x="123" y="154">Codex</text>
  <text class="muted body" x="123" y="177">lit AGENTS.md + skill</text>
  <text class="muted small" x="78" y="211">Adaptateur léger, pas de logique dupliquée</text>

  <rect class="panel" x="475" y="120" rx="18" width="250" height="115"/>
  <circle cx="512" cy="157" r="20" fill="#f97316"/>
  <text class="light h" x="512" y="163" text-anchor="middle">Cl</text>
  <text class="ink h" x="544" y="154">Claude Code</text>
  <text class="muted body" x="544" y="177">lit CLAUDE.md + skill</text>
  <text class="muted small" x="499" y="211">Même procédure, adaptation minimale</text>

  <rect class="panel" x="896" y="120" rx="18" width="250" height="115"/>
  <circle cx="933" cy="157" r="20" fill="#14b8a6"/>
  <text class="light h" x="933" y="163" text-anchor="middle">O</text>
  <text class="ink h" x="965" y="154">OpenCode</text>
  <text class="muted body" x="965" y="177">charge explicitement le skill</text>
  <text class="muted small" x="920" y="211">Même CLI et mêmes contrats JSON</text>

  <path class="line" d="M 179 235 L 179 278 L 600 278"/>
  <path class="line" d="M 600 235 L 600 278"/>
  <path class="line" d="M 1021 235 L 1021 278 L 600 278"/>
  <path class="arrow" d="M 600 278 L 600 305"/>

  <rect class="skill" x="345" y="305" rx="18" width="510" height="120"/>
  <text class="ink h" x="600" y="337" text-anchor="middle">Skill portable configure-project</text>
  <text class="muted body" x="600" y="365" text-anchor="middle">inspecter → expliquer → demander → planifier</text>
  <text class="muted body" x="600" y="387" text-anchor="middle">approuver → appliquer → vérifier</text>
  <text class="muted small" x="600" y="411" text-anchor="middle">Source commune : .agents/skills · adaptation Claude : .claude/skills</text>

  <path class="arrow" d="M 600 425 L 600 455"/>

  <rect class="core" x="420" y="455" rx="18" width="360" height="86"/>
  <text class="light h" x="600" y="488" text-anchor="middle">Sentinel Core CLI</text>
  <text class="light body" x="600" y="514" text-anchor="middle">Résultat identique, quel que soit l’agent hôte</text>

  <text class="ink h" x="54" y="586">Où en est la validation réelle ?</text>

  <rect class="ok" x="54" y="610" rx="16" width="258" height="125"/>
  <circle class="status-ok" cx="81" cy="638" r="10"/>
  <path d="M 76 638 L 80 642 L 87 633" fill="none" stroke="#fff" stroke-width="2.2"/>
  <text class="ink h" x="101" y="644">Windows natif</text>
  <text class="muted body" x="77" y="676">Codex, Claude Code et OpenCode</text>
  <text class="muted body" x="77" y="698">ont réussi le même projet fictif.</text>
  <text class="ink small" x="77" y="721">WSL non requis pour utiliser Sentinel.</text>

  <rect class="next" x="332" y="610" rx="16" width="258" height="125"/>
  <circle class="status-next" cx="359" cy="638" r="10"/>
  <text class="light h" x="359" y="644" text-anchor="middle">!</text>
  <text class="ink h" x="379" y="644">WSL / Linux</text>
  <text class="muted body" x="355" y="676">Prochain test conseillé pour révéler</text>
  <text class="muted body" x="355" y="698">écarts de chemins, droits et shell.</text>
  <text class="ink small" x="355" y="721">Optionnel pour l’usage, utile pour la QA.</text>

  <rect class="later" x="610" y="610" rx="16" width="258" height="125"/>
  <circle class="status-later" cx="637" cy="638" r="10"/>
  <text class="light h" x="637" y="644" text-anchor="middle">…</text>
  <text class="ink h" x="657" y="644">macOS</text>
  <text class="muted body" x="633" y="676">À valider sur une machine réelle</text>
  <text class="muted body" x="633" y="698">avant de promettre la compatibilité.</text>
  <text class="ink small" x="633" y="721">Aucune preuve active pour le moment.</text>

  <rect class="later" x="888" y="610" rx="16" width="258" height="125"/>
  <circle class="status-later" cx="915" cy="638" r="10"/>
  <text class="light h" x="915" y="644" text-anchor="middle">…</text>
  <text class="ink h" x="935" y="644">GitHub distant</text>
  <text class="muted body" x="911" y="676">Lecture et mutations R3 à valider</text>
  <text class="muted body" x="911" y="698">sur un dépôt éligible et isolé.</text>
  <text class="ink small" x="911" y="721">Jamais automatique, même après login.</text>

  <text class="muted small" x="54" y="762">Décision simple : installez WSL pour tester la compatibilité Linux, pas pour rendre Sentinel utilisable sur Windows.</text>
</svg>
